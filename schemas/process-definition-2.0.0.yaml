$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:sia:end-of-alignment:process-definition:2.0.0"
title: Process definition
type: object
additionalProperties: false
required:
  - artifact_type
  - schema_id
  - schema_version
  - id
  - version
  - owners
  - change_authority
  - entry_event
  - entry_subject
  - entry_state
  - terminal_outcomes
  - customer_promise
  - states
  - invariants
  - transitions
x-optional:
  - entry_conditions
  - missing_entry_condition_outcome
  - failure_behaviour
  - evidence_required
  - evidence_completion_rule
  - maturity
  - published_contracts
  - reason_code_registry
properties:
  artifact_type:
    const: process_definition
  schema_id:
    const: "urn:sia:end-of-alignment:process-definition"
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  id: {type: string, minLength: 1}
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  owners:
    type: object
    required: [process, definition]
    additionalProperties: true
  change_authority: {type: string, minLength: 1}
  entry_event: {type: string, minLength: 1}
  entry_subject: {type: string, minLength: 1}
  entry_state: {type: string, minLength: 1}
  terminal_outcomes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  terminal_outcome_cardinality:
    enum: [exactly_one, one_or_more]
  customer_promise: {type: string, minLength: 1}
  entry_conditions:
    type: array
    items: {type: string, minLength: 1}
  missing_entry_condition_outcome: {type: string, minLength: 1}
  states:
    type: object
    minProperties: 2
    additionalProperties: {type: string, minLength: 1}
  invariants:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, name]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        evaluation_id: {type: string, minLength: 1}
        referral_threshold: {type: number}
        threshold_comparison:
          enum: [at_or_above, above, at_or_below, below]
      allOf:
        - if:
            required: [evaluation_id]
          then:
            required: [referral_threshold, threshold_comparison]
      additionalProperties: true
  transitions:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, from, to, event]
      properties:
        id: {type: string, minLength: 1}
        from: {type: string, minLength: 1}
        to:
          oneOf:
            - {type: string, minLength: 1}
            - type: array
              minItems: 1
              items: {type: string, minLength: 1}
        event: {type: string, minLength: 1}
        publishes_event: {type: string, minLength: 1}
        published_contract: {type: string, minLength: 1}
      dependentRequired:
        publishes_event: [published_contract]
        published_contract: [publishes_event]
      additionalProperties: true
  failure_behaviour: {type: object, additionalProperties: true}
  evidence_required:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  evidence_completion_rule: {type: string, minLength: 1}
  maturity: {type: object, additionalProperties: true}
  published_contracts:
    type: array
    uniqueItems: true
    items: {type: string, minLength: 1}
  reason_code_registry: {type: string, minLength: 1}
