$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:sia:end-of-alignment:model-evaluation-record:2.0.0"
title: Model evaluation record
type: object
additionalProperties: false
required:
  - artifact_type
  - schema_id
  - schema_version
  - id
  - version
  - generated_at
  - model
  - process_definition_version
  - authority
  - population
  - test
  - provenance
  - expiry
x-optional:
  - notes
  - maturity
properties:
  artifact_type:
    const: model_evaluation_record
  schema_id:
    const: "urn:sia:end-of-alignment:model-evaluation-record"
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  id:
    type: string
    minLength: 1
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  generated_at: {type: string, format: date-time}
  model:
    type: object
    required: [id, version]
    properties:
      id: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
    additionalProperties: true
  process_definition_version:
    type: string
    minLength: 1
  authority:
    type: object
    required: [use_owner, evidence_owner, permitted_decision, forced_referral_conditions]
    properties:
      use_owner: {type: string, minLength: 1}
      evidence_owner: {type: string, minLength: 1}
      permitted_decision: {type: string, minLength: 1}
      forced_referral_conditions:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, minLength: 1}
    additionalProperties: true
  population:
    type: object
    required: [description, observation_period, size]
    additionalProperties: true
  test:
    type: object
    required: [reference_standard, threshold, threshold_comparison, selection_rule]
    properties:
      threshold_comparison:
        enum: [at_or_above, above, at_or_below, below]
    additionalProperties: true
  provenance:
    type: object
    minProperties: 1
    additionalProperties: true
  expiry:
    type: object
    required: [date, early_stop_conditions, change_rule]
    properties:
      date: {type: string, format: date}
      early_stop_conditions:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      change_rule: {type: string, minLength: 1}
    additionalProperties: true
  notes:
    type: array
    items: {type: string}
  maturity: {type: object, additionalProperties: true}
