$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:sia:end-of-alignment:validation-rule-set:1.0.0"
title: Validation rule set
type: object
additionalProperties: false
required:
  - artifact_type
  - schema_id
  - schema_version
  - id
  - version
  - rule_set_id
  - rule_set_version
  - rules
properties:
  artifact_type: {const: validation_rule_set}
  schema_id: {const: "urn:sia:end-of-alignment:validation-rule-set"}
  schema_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  id: {type: string, minLength: 1}
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  rule_set_id: {type: string, minLength: 1}
  rule_set_version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  rules:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, applies_to, severity, assertion]
      properties:
        id: {type: string, pattern: "^[VW][0-9]{3}$"}
        applies_to: {type: string, minLength: 1}
        severity: {enum: [error, warn]}
        assertion: {type: string, minLength: 1}
